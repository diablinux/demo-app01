apiVersion: apps/v1
kind: Deployment
metadata:
  name: app01
  namespace: demo-apps
  labels:
    app: app01
    demo: "true"
    lifecycle: temporary
spec:
  securityContext:
    runAsNonRoot: true        # Kubernetes will reject the pod if the container tries to run as root (UID 0)
    runAsUser: 1000           # Must match the UID defined via adduser -u 1000 in the Dockerfile
    runAsGroup: 1000          # Must match the GID defined via addgroup -g 1000 in the Dockerfile
    fsGroup: 1000   
  replicas: 3
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app01
  template:
    metadata:
      labels:
        app: app01
        demo: "true"
        lifecycle: temporary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: demo-app-sa
      containers:
      - name: app
        image: docker.io/diablinux/demo-app01:latest
        imagePullPolicy: Always
        env:
        - name: PERSON_NAME
          value: "Alex GD"
        - name: PORT
          value: "8080"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Container-level security context — overrides or supplements the pod-level context
        securityContext:
          allowPrivilegeEscalation: false   # Prevents the process from gaining more privileges than its parent process
          readOnlyRootFilesystem: true       # Mounts the container root filesystem as read-only, limiting attack surface
          capabilities:
            drop:
              - ALL   
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - app01
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
