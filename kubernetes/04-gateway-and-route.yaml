---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app01
  namespace: demo-apps
  labels:
    app: app01
    demo: "true"
    lifecycle: temporary
spec:
  parentRefs:
  - name: public-gateway
    namespace: default
    sectionName: https
  hostnames:
  - "app01.web-services.sytes.net"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: app01
      port: 80
      weight: 100
    timeouts:
      request: 30s
      backendRequest: 30s
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: X-Forwarded-For
          value: "demo-app"
        - name: X-App-Name
          value: "app01"
